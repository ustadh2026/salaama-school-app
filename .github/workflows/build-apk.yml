name: Build Salaama APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor 6 Stable
        run: |
          npm init -y
          npm install @capacitor/cli@6.2.2 @capacitor/core@6.2.2 @capacitor/android@6.2.2

      - name: Make Web Folder
        run: |
          mkdir -p www
          cp index.html www/index.html
          cp logo.png www/logo.png
          cp manifest.json www/manifest.json

      - name: Init Capacitor
        run: |
          npx cap init "Salaama School" com.salaama.school --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Salaama-School-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
